<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- ブラウザのタブのアイコン（部品集の「頁の題とアイコン」）。
       16x16 の角丸の四角（角 3px）に、線の幅 1.6px の 3 本の横線（予約の列）。色はトークンの値：
       四角は primary（暗い地は link の暗い地の値）、絵の線は白（暗い地は #1b1b1b）。
       開発・試験の環境の色替えは、環境を知らせる方法が決まるまで入れない -->
  <style>
    .box { fill: #4b4fbf; }
    .mark { fill: none; stroke: #ffffff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #a5a8ff; }
      .mark { stroke: #1b1b1b; }
    }
  </style>
  <rect class="box" width="16" height="16" rx="3" />
  <path class="mark" d="M4.5 5h7M4.5 8h7M4.5 11h4.5" />
</svg>
