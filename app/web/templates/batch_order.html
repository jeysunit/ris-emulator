{% extends "base.html" %}
{% block title %}一括作成{% endblock %}
{% block content %}
<h1>一括作成</h1>
{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="/orders/batch" class="form">
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
  <fieldset>
    <legend>モダリティごとの件数（合わせて {{ max_orders }} 件まで）</legend>
    <div class="counts">
      {% for modality, entry in catalog.items() %}
      <div>
        <label>{{ modality }}
          <input type="number" name="count_{{ modality }}" min="0" max="{{ max_orders }}" value="{{ values.get('count_' ~ modality, '') }}" inputmode="numeric">
        </label>
        {% if entry.stations | length > 1 %}
        <label>装置
          <select name="station_{{ modality }}" aria-label="{{ modality }} の装置">
            <option value="">全装置に振り分け</option>
            {% for station in entry.stations %}
            <option value="{{ station.name }}"{% if values.get('station_' ~ modality) == station.name %} selected{% endif %}>{{ station.name }}（{{ station.ae_title }}）</option>
            {% endfor %}
          </select>
        </label>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </fieldset>
  <fieldset>
    <legend>予定</legend>
    <label>予定日 <input type="date" name="date" value="{{ values.get('date', today.isoformat()) }}" required></label>
    <label>開始時刻
      <span class="time-select">
        <select name="hour" aria-label="時">
          {% for h in hours %}
          <option value="{{ h }}"{% if values.get('hour', '09') == h %} selected{% endif %}>{{ h }}</option>
          {% endfor %}
        </select>
        :
        {% set selected = values.get('minute', '00') %}
        {% include "_minute_select.html" %}
      </span>
    </label>
    <label>間隔（分）
      <select name="interval" hx-get="/orders/batch/minutes" hx-target="#minute-select" hx-swap="outerHTML" hx-include="#minute-select">
        {% for i in intervals %}
        <option value="{{ i }}"{% if i == interval %} selected{% endif %}>{{ i }}</option>
        {% endfor %}
      </select>
    </label>
  </fieldset>
  <fieldset>
    <legend>患者</legend>
    <label><input type="radio" name="patients" value="random"{% if values.get('patients', 'random') == 'random' %} checked{% endif %}> 新規（架空）</label>
    <label><input type="radio" name="patients" value="roster"{% if values.get('patients') == 'roster' %} checked{% endif %}> 名簿から無作為に</label>
  </fieldset>
  <fieldset>
    <legend>依頼</legend>
    <label>依頼科
      <select name="department">
        <option value="">ランダム</option>
        {% for d in departments %}
        <option value="{{ d }}"{% if values.get('department') == d %} selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>
    </label>
    <label>文字コード
      <select name="charset">
        {% for c in character_sets %}
        <option value="{{ c.value }}"{% if values.get('charset', default_character_set.value) == c.value %} selected{% endif %}>{{ character_set_labels[c] }}</option>
        {% endfor %}
      </select>
    </label>
  </fieldset>
  <button type="submit" class="btn btn-primary">作成</button>
</form>
{% endblock %}
