<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <title>{% block title %}{% endblock %} - ris-emulator</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header class="site-header">
    <div class="wrap header-row">
      <p class="brand-row"><a href="/orders" class="brand">ris-emulator</a> <span class="version">{{ version }}</span></p>
      <nav class="nav" aria-label="ページ">
        <a href="/orders" class="nav-link">予約一覧</a>
        <a href="/orders/new" class="nav-link">予約作成</a>
      </nav>
      <p class="mwl-state">
        MWL：{{ mwl_config.ae_title }}
        {% if mwl.running %}
        <span class="badge badge-ok">待ち受け中</span> {{ mwl_config.bind_address }}:{{ mwl.port }}
        {% else %}
        <span class="badge badge-off">停止</span>
        {% endif %}
      </p>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
