# テストを通してから、Docker イメージを作って GHCR（ghcr.io/jeysunit/ris-emulator）へ公開する。
# - main への push：latest と sha-<短い hash> のタグで公開する
# - 版のタグ（v*）の push：vX.Y.Z と sha-<短い hash> のタグで公開する
# - PR：テストとイメージのビルドだけを行い、公開しない
# permissions は contents: read と、公開する job の packages: write だけ。actions は commit の SHA で固定する。
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: テスト
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  image:
    name: イメージのビルドと GHCR への公開
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 版を git のタグから作るので、履歴とタグを全部取る
          fetch-depth: 0
      - id: version
        name: 版を git から作る（タグの上は X.Y.Z、タグより後は X.Y.Z+N.gHASH）
        run: echo "value=$(sh scripts/app-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jeysunit/ris-emulator
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 「バージョン情報」の画面に出す（commit は公開の値）
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
